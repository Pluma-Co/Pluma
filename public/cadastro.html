<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <title>Pluma | Cadastro</title>
  <link rel="stylesheet" href="css/cadLog.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <script src="./js/sessao.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body onload="listar()">
  <!-- CABEÇALHO -->
  <header>
    <nav>
      <img class="logonav" src="assets/logo_branca.png" alt="Logo Pluma">

      <div class="nav-item">
        <img class="iconenav" src="assets/icons/icon_home.png" alt="">

        <a href="index.html">
          Home
        </a>
      </div>
      <div class="nav-item">
        <img class="iconenav" src="assets/icons/icone_grupo.png" alt="">

        <a href="index.html#sobre-nos">
          Sobre Nós
        </a>
      </div>

      <div class="btn">
        <a href="login.html">
          <button class="btn_login">
            Login
          </button>
        </a>

        <a href="cadastro.html">
          <button class="btn_nav">
            Cadastro
          </button>
        </a>

      </div>
    </nav>
  </header>
  <!--  FIM CABEÇALHO -->
  <div class="container">

    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>


    <!-- Lado esquerdo: logo -->
    <div class="lado-esquerdo">
      <img src="assets/logo_branca.png" alt="Pluma">
    </div>

    <!-- Lado direito: formulário -->
    <div class="lado-direito">
      <div class="formulario">
        <h1>Olá!</h1>
        <p>Cadastre-se e comece<br>agora a gestão da sua usina!</p>

        <div class="campo">
          <img src="assets/icons/icone-usina.svg" alt="">
          <input type="text" placeholder="Código da empresa" id="ipt_codigo_empresa">
        </div>
        <div id="div_msg_codigo_usina"></div>

        <div class="campo">
          <img src="assets/icons/circle-user.svg" alt="">
          <input type="text" placeholder="Nome Completo" id="ipt_nome">
        </div>
        <div id="div_msg_nome"></div>

        <div class="campo">
          <img src="assets/icons/mail.svg" alt="">
          <input type="text" placeholder="seu@email.com" id="ipt_email">
        </div>
        <div id="div_msg_email"></div>

        <div class="campo">
          <img src="assets/icons/lock.svg" alt="">
          <input type="password" placeholder="Senha" id="ipt_senha">
        </div>
        <div id="div_msg_senha"></div>

        <div class="campo">
          <img src="assets/icons/lock.svg" alt="">
          <input type="password" placeholder="Confirme a Senha" id="ipt_confirmacao">
        </div>
        <div id="div_msg_confirmacao"></div>

        <button onclick="cadastrar()">Cadastrar</button>
        <!-- <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>
   -->
      </div>
      <div id="div_erros_login"></div>
    </div>



</body>

</html>

<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;
    var confirmacaoSenhaVar = ipt_confirmacao.value;
    var codigoVar = ipt_codigo_empresa.value;
    var idEmpresaVincular

    let codigoEmpresaValido = true;
    let nomeValido = true;

    let emailValido = true;
    let senhaValida = true;
    let confirmacaoValida = true;


    // Verificando se há algum campo em branco
    // if (
    //   nomeVar == "" ||
    //   emailVar == "" ||
    //   senhaVar == "" ||
    //   confirmacaoSenhaVar == "" ||
    //   codigoVar == ""
    // ) {
    //   cardErro.style.display = "block";
    //   mensagem_erro.innerHTML =
    //     "(Mensagem de erro para todos os campos em branco)";

    //   finalizarAguardar();
    //   return false;
    // } else {
    //   setInterval(sumirMensagem, 5000);
    // }

    // validar nome
    if (nomeVar.length == 0) {
      div_msg_nome.innerHTML = `<p style="color:red; font-size:10px">Digite seu nome completo</p>`;
      nomeValido = false;
    }
    else {
      div_msg_nome.innerHTML = ``;
    }


    // validar e-mail
    if (!emailVar.includes('@') || !emailVar.includes('.')) {
      div_msg_email.innerHTML = `<p style="color:red; font-size:10px">Digite um e-mail válido</p>`;

      emailValido = false;

    } else {
      div_msg_email.innerHTML = ``;
    }

    // validar senha
    if (senhaVar.length <= 8) {
      div_msg_senha.innerHTML = `<p style="color:red; font-size:10px">A senha deve ter mais de 8 caracteres</p>`;
      senhaValida = false;

    } else if (senhaVar == senhaVar.toLowerCase()) {
      div_msg_senha.innerHTML = `<p style="color:red; font-size:10px">A senha deve ter ao menos uma letra maiúscula</p>`;

      senhaValida = false;
    }
    else {
      div_msg_senha.innerHTML = ``;
    }

    // validar confirmacao de senha 
    if (confirmacaoSenhaVar != senhaVar || confirmacaoSenhaVar.length == 0) {
      div_msg_confirmacao.innerHTML = `<p style="color:red; font-size:10px">As senhas não coincidem</p>`;
      confirmacaoValida = false;
    }
    else {
      div_msg_confirmacao.innerHTML = ``;
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        codigoEmpresaValido = false;
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    if (codigoEmpresaValido && nomeValido && emailValido && senhaValida && confirmacaoValida) {

      // Enviando o valor da nova input
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: nomeVar,
          emailServer: emailVar,
          senhaServer: senhaVar,
          idEmpresaVincularServer: idEmpresaVincular
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            cardErro.style.display = "block";

            mensagem_erro.innerHTML =
              "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

            setTimeout(() => {
              window.location = "login.html";
            }, "2000");

            limparFormulario();
            finalizarAguardar();
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
          finalizarAguardar();
        });
    }

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
