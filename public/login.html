<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="stylesheet" href="css/cadLog.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- WEB DATA VIZ -->
    <script src="./js/sessao.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">

</head>

<body>

    <!--Header-->


    <!-- CABEÇALHO -->
    <header>
        <nav>
            <img class="logonav" src="assets/logo_branca.png" alt="Logo Pluma">

            <div class="nav-item">
                <img class="iconenav" src="assets/icons/icon_home.png" alt="">

                <a href="index.html">
                    Home
                </a>
            </div>
            <div class="nav-item">
                <img class="iconenav" src="assets/icons/icone_grupo.png" alt="">

                <a href="index.html#sobre-nos">
                    Sobre Nós
                </a>
            </div>

            <div class="btn">
                <a href="login.html">
                    <button class="btn_login">
                        Login
                    </button>
                </a>

                <a href="cadastro.html">
                    <button class="btn_nav">
                        Cadastro
                    </button>
                </a>

            </div>
        </nav>
    </header>

    <div class="container">

        <!-- Lado esquerdo: logo -->
        <div class="lado-esquerdo">
            <img src="assets/logo_branca.png" alt="Pluma">
        </div>

        <!-- Lado direito: formulário -->
        <div class="lado-direito">
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>
            <div class="formulario">
                <h1>Bem-vindo de Volta!</h1>
                <p>Realize seu login</p>

                <div class="campo">
                    <img src="assets/icons/mail.svg" alt="">
                    <input type="text" placeholder="seu@email.com" id="ipt_email">

                </div>
                <div id="div_msg_email"></div>

                <div class="campo">
                    <img src="assets/icons/lock.svg" alt="">
                    <input type="password" placeholder="digite sua senha" id="ipt_senha">
                </div>
                <div id="div_msg_senha"></div>

                <button onclick="entrar()">Login</button>

                <a href="#" class="esqueceu">Esqueceu a senha?</a>
            </div>

            <!-- popups de erro -->
            <!-- <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif">
                </div> -->

                <div id="div_erros_login"></div>
        </div>

</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
