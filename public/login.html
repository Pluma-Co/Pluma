<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Pluma | Login</title>
  <link rel="stylesheet" href="css/cadLog.css">
  <link rel="stylesheet" href="css/style.css">

</head>

<body>
   <!-- CABEÇALHO -->
    <header style="height: 70px; display: flex; align-items: center; background-color: #04201d; /* Ajuste a cor de fundo se necessário */">
        
        <nav style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 40px;">
            
            <!-- Grupo da Esquerda: Logo e Home -->
            <div style="display: flex; align-items: center; gap: 40px;">
                <img class="logonav" src="assets/logo_branca.png" alt="Logo Pluma" style="height: 35px; width: auto;">
                
                <div class="nav-item" style="display: flex; align-items: center; gap: 10px;">
                    <img class="iconenav" src="assets/icons/icon_home.png" alt="" style="height: 20px;">
                    <a href="index.html" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px;">
                        HOME
                    </a>
                </div>
            </div>

            <!-- Grupo da Direita: Cadastro e Login -->
            <div class="nav-links" style="display: flex; gap: 30px;">
                <a href="cadastro.html" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px;">
                    CADASTRO
                </a>
                <a href="login.html" style="color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px;">
                    LOGIN
                </a>
            </div>

        </nav>

    </header>
  <div class="container">

    <!-- Lado esquerdo: logo -->
    <div class="lado-esquerdo">
      <img src="assets/logo_branca.png" alt="Pluma">
    </div>

    <!-- Lado direito: formulário -->
    <div class="lado-direito">
      <div class="formulario">
        <h1>Bem-vindo de Volta!</h1>
        <p>Realize seu login</p>

        <div class="campo">
          <img src="assets/icons/mail.svg" alt="">
          <input type="text" placeholder="seu@email.com" id="ipt_email">

        </div>
        <div id="div_msg_email"></div>

        <div class="campo">
          <img src="assets/icons/lock.svg" alt="">
          <input type="password" placeholder="digite sua senha" id="ipt_senha">
        </div>
        <div id="div_msg_senha"></div>

        <button onclick="autenticarLogin()">Login</button>

        <a href="#" class="esqueceu">Esqueceu a senha?</a>
      </div>
    </div>

  </div>

</body>

</html>

<script>
  let tentativa = 0;
  let limiteTentativa = 5;

  function autenticarLogin() {
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    let emailValido = false;
    let senhaValida = false;

    let limiteTentativa = 5;

    if (!email.includes('@') || !email.includes('.')) {
      div_msg_email.innerHTML = `<p style='color:red; font-size: 10px'>Digite um e-mail válido</p>`
      emailValido = false;
    } else {
      div_msg_email.innerHTML = '';
      emailValido = true;
    }

    if (senha.length <= 8) {
      div_msg_senha.innerHTML = `<p style="color:red; front-size:10px"> senha incorreta<p>`
      senhaValida = false;
    }
    else if (senha == senha.toLowerCase()) {
      div_msg_senha.innerHTML = `<p style="color:red; font-size:10px">senha incorreta</p>`;
      senhaValida = false;
    } else {
      senhaValida = true;
    }
     if (emailValido && senhaValida) {
      let continuar = true;

    while (continuar && tentativa < limiteTentativa) {
        tentativa++;
        continuar = false;

        if (senha == "@Pluma2026") {
          div_msg_senha.innerHTML =
            window.location.href = "dashboard.html";
        } else {
          if (tentativa < limiteTentativa) {
            div_msg_senha.innerHTML =
              "<p style='color:red; font-size:10px'>Senha incorreta. Você tem " +
              (limiteTentativa - tentativa) +
              " tentativas restantes.</p>";
          } else {
            div_msg_senha.innerHTML =
              "<p style='color:red; font-size:10px'>Limite de tentativas atingido.</p>";
          }
        }
      }
    }
  }

</script>
