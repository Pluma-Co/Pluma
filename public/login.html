<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <title>Pluma | Login</title>
  <link rel="stylesheet" href="css/cadLog.css">
  <link rel="stylesheet" href="css/style.css">

</head>

<body>


  <!-- CABEÇALHO -->
   <header>
      <nav class="navbar">
        <div class="logo">
          <img src="assets/logoEscura.png" alt="Logo da Pluma" />
        </div>
        <ul class="nav-links">
          <li><a href="#">Quem somos</a></li>
          <li><a href="#">Contato</a></li>
          <li><a href="#">Soluções</a></li>
        </ul>
        <div class="login-button">
          <button class="btn-login">Login</button>
          <button class="btn-start">Get start free</button>
        </div>
      </nav>
    </header>

  <div class="container">

    <!-- Lado esquerdo: logo -->
    <div class="lado-esquerdo">
      <img src="assets/logo_branca.png" alt="Pluma">
    </div>

    <!-- Lado direito: formulário -->
    <div class="lado-direito">
      <div class="formulario">
        <h1>Bem-vindo de Volta!</h1>
        <p>Realize seu login</p>

        <div class="campo">
          <img src="assets/icons/mail.svg" alt="">
          <input type="text" placeholder="seu@email.com" id="ipt_email">

        </div>
        <div id="div_msg_email"></div>

        <div class="campo">
          <img src="assets/icons/lock.svg" alt="">
          <input type="password" placeholder="digite sua senha" id="ipt_senha">
        </div>
        <div id="div_msg_senha"></div>

        <button onclick="autenticarLogin()">Login</button>

        <a href="#" class="esqueceu">Esqueceu a senha?</a>
      </div>
    </div>

  </div>

</body>

</html>

<script>
  let tentativa = 0;
  let limiteTentativa = 5;

  function autenticarLogin() {
    let email = ipt_email.value;
    let senha = ipt_senha.value;

    let emailValido = false;
    let senhaValida = false;

    let limiteTentativa = 5;

    if (!email.includes('@') || !email.includes('.')) {
      div_msg_email.innerHTML = `<p style='color:red; font-size: 10px'>Digite um e-mail válido</p>`
      emailValido = false;
    } else {
      div_msg_email.innerHTML = '';
      emailValido = true;
    }

    if (senha.length <= 8) {
      div_msg_senha.innerHTML = `<p style="color:red; front-size:10px"> senha incorreta<p>`
      senhaValida = false;
    }
    else if (senha == senha.toLowerCase()) {
      div_msg_senha.innerHTML = `<p style="color:red; font-size:10px">senha incorreta</p>`;
      senhaValida = false;
    } else {
      senhaValida = true;
    }
    if (emailValido && senhaValida) {
      let continuar = true;

      while (continuar && tentativa < limiteTentativa) {
        tentativa++;
        continuar = false;

        if (senha == "@Pluma2026") {
          div_msg_senha.innerHTML =
            window.location.href = "dashboard.html";
        } else {
          if (tentativa < limiteTentativa) {
            div_msg_senha.innerHTML =
              "<p style='color:red; font-size:10px'>Senha incorreta. Você tem " +
              (limiteTentativa - tentativa) +
              " tentativas restantes.</p>";
          } else {
            div_msg_senha.innerHTML =
              "<p style='color:red; font-size:10px'>Limite de tentativas atingido.</p>";
          }
        }
      }
    }
  }

</script>
